name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: MATLAB public test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # the suite needs no .mat run data, so skip the LFS pull

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Statistics_and_Machine_Learning_Toolbox

      # scripts/run_public_ci_checks.m runs the test classes that need neither
      # Simulink, Simscape nor the bulk .mat runs, which are gitignored with one
      # sample kept per category and so are absent from a clean checkout.
      - name: Run public test suite
        uses: matlab-actions/run-command@v2
        with:
          command: run("scripts/run_public_ci_checks.m")

  model:
    name: Simulink model structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # the model loads without its LFS .mat data; only structure is checked

      # Simulink, Simscape and Simscape Multibody take several minutes to
      # install, which is why this is a separate job from the fast suite.
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: |
            Simulink
            Simscape
            Simscape_Multibody

      # Loads Robot_Phase1_PASS and checks its structure. It is not simulated:
      # 20 s of ode15s over a multibody arm is minutes of CPU per push.
      - name: Run model structure checks
        uses: matlab-actions/run-command@v2
        with:
          command: run("scripts/run_model_checks.m")
